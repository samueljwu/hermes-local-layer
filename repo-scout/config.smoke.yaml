# Cheap unauthenticated smoke-test config.
# Intended to verify harness behavior without exhausting GitHub's low unauthenticated limits.

languages:
  - Python

topics:
  - llm

keywords: []

min_stars: 50
max_stars: 20000
pushed_within_days: 45
min_commits_per_month: 1
commit_months: 1
max_candidates: 5
max_api_repos_for_commit_check: 2
shortlist_size: 3
cache_ttl_hours: 24

allowed_licenses:
  - MIT
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC
  - MPL-2.0

contribution_labels:
  - good first issue
  - help wanted

interest_roots: []
